name: Android debug build

# Builds the xPin Android app (Capacitor + Gradle) and uploads the debug APK.
# Runs on every push to main and on manual trigger. No signing: the debug
# APK uses the automatic debug key. A signed release build is a separate
# step (needs a keystore) and is not done here.
#
# NOTE: setup-android must stay on v4+. v3 installs the retired SDK
# "tools" package (Google removed it 2026-09-15), so the SDK step failed
# with "Failed to find package 'tools'". v4 drops it.
# NOTE: JDK must stay on 21. Capacitor 8.6's Android library compiles
# with source/target Java 21 (its build.gradle sets VERSION_21), so
# JDK 17 fails the build with "invalid source release: 21".
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 36
          build-tools-version: 36.0.0
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Build debug APK
        run: npm run android:debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xpin-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
